<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reino Sombrio - Criar Personagem</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: #0a0a1a;
    background-image:
      linear-gradient(rgba(10,14,26,0.92), rgba(10,14,26,0.92)),
      repeating-linear-gradient(0deg, transparent 0 6px, rgba(74,246,255,0.04) 6px 8px),
      repeating-linear-gradient(90deg, transparent 0 6px, rgba(74,246,255,0.04) 6px 8px);
    color: #e0e0e0;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    padding: 20px;
    image-rendering: pixelated;
  }
  .wrap { max-width: 560px; margin: auto; }
  h1 { font-size: 14px; color: #4af6ff; text-align: center; text-shadow: 2px 2px 0 #a06bff; margin: 20px 0 6px; }
  h1 span { display: block; font-size: 10px; color: #a06bff; margin-top: 4px; }
  .aviso { text-align: center; font-size: 9px; color: #7a7a9a; margin: 12px 0 20px; }
  label { display: block; font-size: 10px; color: #a0a0c0; margin: 20px 0 6px; }
  input {
    width: 100%; padding: 14px 12px; background: #05070f; color: #4af6ff;
    border: 2px solid #2a3050; font-family: inherit; font-size: 12px; outline: none;
  }
  input:focus { border-color: #4af6ff; box-shadow: 0 0 8px rgba(74,246,255,0.5); }
  .classes { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
  .classe {
    display: block; padding: 16px;
    background: #10142a; border: 3px solid #2a3050; cursor: pointer;
    transition: all 0.15s;
  }
  .classe input { display: none; }
  .classe:hover { border-color: #4a6a9a; }
  .classe input:checked + .conteudo { color: #4af6ff; }
  .classe.selecionada { border-color: #4af6ff; box-shadow: 0 0 15px rgba(74,246,255,0.4); }
  .titulo { font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .titulo .emoji { font-size: 22px; }
  .desc { font-size: 9px; color: #a0a0c0; line-height: 1.6; }
  .stats { font-size: 9px; margin-top: 8px; color: #6a6a9a; }
  button {
    width: 100%; margin-top: 24px; padding: 16px;
    font-family: inherit; font-size: 12px; letter-spacing: 1px;
    background: #4af6ff; color: #0a0a1a; border: 3px solid #4af6ff;
    box-shadow: 4px 4px 0 #0a2a30; cursor: pointer; text-transform: uppercase;
  }
  button:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #0a2a30; }
  .erro {
    background: #2a0a0a; border: 2px solid #ff4466; color: #ff8899;
    padding: 10px; font-size: 9px; margin-top: 16px; text-align: center; line-height: 1.5;
  }
</style>
<link rel="manifest" href="/static/manifest.json">
</head>
<body>
<div class="wrap">
  <h1>CRIAR PERSONAGEM<span>Reino Sombrio MMORPG</span></h1>
  <div class="aviso">escolha seu nome e sua classe</div>

  <form method="POST" id="form">
    <label>NOME DO PERSONAGEM</label>
    <input name="nome_personagem" maxlength="16" required
           pattern="[a-zA-Z0-9 ]+" title="Letras, numeros e espaco"
           placeholder="ex: Trezes" autofocus>

    <label>CLASSE</label>
    <div class="classes">
      {% for id, info in classes.items() %}
      <label class="classe" onclick="sel(this)">
        <input type="radio" name="classe" value="{{ id }}" {% if loop.first %}checked{% endif %}>
        <div class="conteudo">
          <div class="titulo" style="color: {{ info.cor }}">
            <span class="emoji">{{ info.emoji }}</span> {{ info.nome }}
          </div>
          <div class="desc">{{ info.descricao }}</div>
          <div class="stats">HP maximo: {{ info.hp_max }} · Arma: {{ info.arma }}</div>
        </div>
      </label>
      {% endfor %}
    </div>

    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}

    <button type="submit">Criar personagem</button>
  </form>
</div>
<script>
function sel(el) {
  document.querySelectorAll('.classe').forEach(c => c.classList.remove('selecionada'));
  el.classList.add('selecionada');
}
document.addEventListener('DOMContentLoaded', () => {
  const checked = document.querySelector('input[name="classe"]:checked');
  if (checked) checked.closest('.classe').classList.add('selecionada');
});
</script>
</body></html>
