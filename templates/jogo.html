<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Reino Sombrio</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a1a; touch-action:none; font-family:monospace; }
  #jogo { width:100vw; height:100vh; }
  #jogo canvas { display:block !important; width:100vw !important; height:100vh !important; }

  #hud {
    position:fixed; top:8px; left:8px; z-index:100;
    background:rgba(20,15,30,0.85); border:2px solid #4af6ff;
    border-radius:6px; padding:6px 10px; color:#4af6ff;
    font-size:11px; line-height:1.6;
  }
  #hud b { color:#fff; }

  #joy {
    position:fixed; left:20px; bottom:20px; width:120px; height:120px;
    border-radius:50%; background:rgba(74,246,255,0.15);
    border:3px solid rgba(74,246,255,0.5); z-index:200;
    touch-action:none; user-select:none;
  }
  #joy-knob {
    position:absolute; left:50%; top:50%;
    width:60px; height:60px; margin:-30px 0 0 -30px;
    border-radius:50%; background:rgba(74,246,255,0.7);
    border:2px solid #fff; pointer-events:none;
    box-shadow:0 0 12px rgba(74,246,255,0.8);
  }
  #btn-atk {
    position:fixed; right:20px; bottom:20px; width:70px; height:70px;
    border-radius:50%; background:rgba(200,50,50,0.85);
    border:3px solid #ff4444; z-index:200;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:32px; touch-action:none;
  }
  #btn-info {
    position:fixed; right:110px; bottom:110px; width:60px; height:60px;
    border-radius:50%; background:rgba(100,80,200,0.85);
    border:3px solid #a06bff; z-index:200;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:24px; touch-action:none;
  }
</style>
<script src="/static/lib/phaser.min.js"></script>
</head>
<body>
<div id="jogo"></div>
<div id="hud">
  <div><b>Trezes</b> <span style="color:#ffd700">👑</span> Nv 1300</div>
  <div>HP: <span style="color:#ff6666">2014/2080</span></div>
</div>
<div id="joy"><div id="joy-knob"></div></div>
<div id="btn-atk">⚔️</div>
<div id="btn-info">📜</div>

<script>
var player, teclas;
var joyAtivo = false;
var ultimaDir = "baixo";
var atacando = false;
var joyOrigem = {x:0, y:0};
var joyDelta = {x:0, y:0};

function preload() {
  this.load.image('grama', '/static/sprites/terreno/chao/grama_lobby.png');
  this.load.image('terra', '/static/sprites/terreno/chao/terra_caminho.png');
  this.load.image('pedra', '/static/sprites/terreno/chao/pedra_ruinas.png');
  this.load.image('muro_frente', '/static/sprites/lobby/muros/muro_frente.png');
  this.load.image('muro_lateral', '/static/sprites/lobby/muros/muro_lateral.png');
  this.load.image('portao', '/static/sprites/lobby/muros/portao.png');
  // ARVORES - 5 por cor (20 no total)
var ARVORES_CARREGAR = {
    brown:  ['brown_01','brown_02','brown_03','brown_04','brown_05','brown_06','brown_07','brown_08','brown_09','brown_10','brown_11','brown_12','brown_13','brown_14','brown_15','brown_16','brown_17','brown_18','brown_19','brown_20','brown_21','brown_22','brown_23','brown_24','brown_25','brown_26','brown_27','brown_28','brown_29','brown_30','brown_31','brown_32','brown_33','brown_34','brown_35','brown_36','brown_37','brown_38','brown_39'],
    dead:   ['dead_01','dead_02','dead_03','dead_04','dead_05','dead_06','dead_07','dead_08','dead_09','dead_10','dead_11','dead_12','dead_13','dead_14','dead_15','dead_16','dead_17','dead_18','dead_19','dead_20','dead_21','dead_22','dead_23','dead_24','dead_25','dead_26','dead_27','dead_28','dead_29','dead_30','dead_31','dead_32','dead_33','dead_34','dead_35','dead_36','dead_37'],
    green:  ['green_01','green_02','green_03','green_04','green_05','green_06','green_07','green_08','green_09','green_10','green_11','green_12','green_13','green_14','green_15','green_16','green_17','green_18','green_19','green_20','green_21','green_22','green_23','green_24','green_25','green_26','green_27','green_28','green_29','green_30','green_31','green_32','green_33','green_34','green_35','green_36','green_37','green_38','green_39'],
    orange: ['orange_01','orange_02','orange_03','orange_04','orange_05','orange_06','orange_07','orange_08','orange_09','orange_10','orange_11','orange_12','orange_13','orange_14','orange_15','orange_16','orange_17','orange_18','orange_19','orange_20','orange_21','orange_22','orange_23','orange_24','orange_25','orange_26','orange_27','orange_28','orange_29','orange_30','orange_31','orange_32','orange_33','orange_34','orange_35','orange_36','orange_37','orange_38','orange_39']
  };
  for (var cor in ARVORES_CARREGAR) {
    var lista = ARVORES_CARREGAR[cor];
    for (var ii = 0; ii < lista.length; ii++) {
      var nome = lista[ii];
      this.load.image('tree-' + nome, '/static/sprites/arvores_final/' + nome + '.png');
    }
  }

  var DIRS = ['baixo','cima','esq','dir'];
  for (var di = 0; di < DIRS.length; di++) {
    var d = DIRS[di];
    this.load.image('idle-' + d + '-0', '/static/sprites/jogador/idle-' + d + '-0.png');
    this.load.image('idle-' + d + '-1', '/static/sprites/jogador/idle-' + d + '-1.png');
    for (var i = 0; i < 9; i++) {
      this.load.image('walk-' + d + '-' + i, '/static/sprites/jogador/walk-' + d + '-' + i + '.png');
    }
    for (var j = 0; j < 6; j++) {
      this.load.image('slash-' + d + '-' + j, '/static/sprites/jogador/slash-' + d + '-' + j + '.png');
    }
  }
}

function create() {
  var TILE = 64;
  var LW = 4096, LH = 4096;
  // Centro do mundo (usado pelo player e camera)
  var cx = LW / 2;
  var cy = LH / 2;

  // ===== CHAO DO MUNDO (com reino central) =====
  // O reino ocupa tiles 12 a 52 (40x40 tiles)
  var REINO_X = 12;
  var REINO_Y = 12;
  var REINO_W = 40;
  var REINO_H = 40;

  function dentroReino(tx, ty) {
    return tx >= REINO_X && tx < REINO_X + REINO_W &&
           ty >= REINO_Y && ty < REINO_Y + REINO_H;
  }

  function ehCaminhoReino(tx, ty) {
    if (!dentroReino(tx, ty)) return false;
    var rcx = REINO_X + REINO_W / 2;
    var rcy = REINO_Y + REINO_H / 2;
    return Math.abs(tx - rcx) <= 3 || Math.abs(ty - rcy) <= 3;
  }

  // Chao base (grama em todo lugar + pedra no reino)
  for (var y = 0; y < LH; y += TILE) {
    for (var x = 0; x < LW; x += TILE) {
      var tx = Math.floor(x / TILE);
      var ty = Math.floor(y / TILE);
      if (dentroReino(tx, ty) && ehCaminhoReino(tx, ty)) {
        this.add.image(x, y, 'pedra').setOrigin(0, 0).setDisplaySize(TILE, TILE).setDepth(0);
      } else {
        this.add.image(x, y, 'grama').setOrigin(0, 0).setDisplaySize(TILE, TILE).setDepth(0);
      }
    }
  }

  // Fonte central
  var cx_px = (REINO_X + REINO_W / 2) * TILE;
  var cy_px = (REINO_Y + REINO_H / 2) * TILE;
  var fonte_borda = this.add.circle(cx_px, cy_px, TILE * 2.8, 0x2a6090);
  fonte_borda.setDepth(1);
  var fonte = this.add.circle(cx_px, cy_px, TILE * 2.5, 0x4aa0ff);
  fonte.setDepth(1.5);
  console.log('[REINO] chao + fonte criados em ' + REINO_X + ',' + REINO_Y);

  // ===== MUROS DO REINO =====
  var GATE_INI = 29;
  var GATE_FIM = 35;

  // Muro NORTE (topo)
  for (var wx = REINO_X; wx < REINO_X + REINO_W; wx++) {
    var wx_px = wx * TILE + TILE / 2;
    var wy_px = REINO_Y * TILE + TILE;
    var eh_portao_n = (wx >= GATE_INI && wx <= GATE_FIM);
    var key_n = eh_portao_n ? 'portao' : 'muro_frente';
    var wall_n = this.add.image(wx_px, wy_px, key_n);
    wall_n.setOrigin(0.5, 1);
    wall_n.setDepth(wy_px - 1);
  }

  // Muro SUL (fundo)
  for (var wx = REINO_X; wx < REINO_X + REINO_W; wx++) {
    var wx_px = wx * TILE + TILE / 2;
    var wy_px = (REINO_Y + REINO_H) * TILE;
    var eh_portao_s = (wx >= GATE_INI && wx <= GATE_FIM);
    var key_s = eh_portao_s ? 'portao' : 'muro_frente';
    var wall_s = this.add.image(wx_px, wy_px, key_s);
    wall_s.setOrigin(0.5, 1);
    wall_s.setDepth(wy_px - 1);
  }

  // Muro OESTE (esquerdo)
  for (var wy = REINO_Y; wy < REINO_Y + REINO_H; wy++) {
    var wx_px = REINO_X * TILE + TILE / 2;
    var wy_px = wy * TILE + TILE;
    var eh_portao_o = (wy >= GATE_INI && wy <= GATE_FIM);
    var key_o = eh_portao_o ? 'portao' : 'muro_lateral';
    var wall_o = this.add.image(wx_px, wy_px, key_o);
    wall_o.setOrigin(0.5, 1);
    wall_o.setDepth(wy_px - 1);
  }

  // Muro LESTE (direito)
  for (var wy = REINO_Y; wy < REINO_Y + REINO_H; wy++) {
    var wx_px = (REINO_X + REINO_W) * TILE - TILE / 2;
    var wy_px = wy * TILE + TILE;
    var eh_portao_l = (wy >= GATE_INI && wy <= GATE_FIM);
    var key_l = eh_portao_l ? 'portao' : 'muro_lateral';
    var wall_l = this.add.image(wx_px, wy_px, key_l);
    wall_l.setOrigin(0.5, 1);
    wall_l.setDepth(wy_px - 1);
  }

  console.log('[REINO] muros criados');

  // ===== PREDIOS DO REINO (retangulos placeholder) =====
  // Formato: [x_tile, y_tile, largura_tiles, altura_tiles, cor_parede, cor_telhado, nome]
  var PREDIOS = [
    // Quadrante NO
    [14, 14, 10, 7, 0x7090d0, 0x4060a0, 'prefeitura'],
    [14, 23,  8, 5, 0xb080d0, 0x705090, 'alquimista'],
    // Quadrante NE
    [40, 14, 10, 6, 0xa07050, 0x704030, 'ferreiro'],
    [40, 22,  8, 5, 0x7090c0, 0x406090, 'banco'],
    // Quadrante SE
    [40, 37,  9, 5, 0xb080c0, 0x705090, 'mercador'],
    [40, 44,  8, 6, 0xd0a070, 0x906040, 'estalagem'],
    // Quadrante SO
    [14, 37, 10, 5, 0xc06060, 0x903030, 'pvp'],
    [14, 44,  8, 6, 0x9070c0, 0x604090, 'capela'],
  ];

  for (var pi = 0; pi < PREDIOS.length; pi++) {
    var pr = PREDIOS[pi];
    var px_tile = pr[0];
    var py_tile = pr[1];
    var pw_tile = pr[2];
    var ph_tile = pr[3];
    var cor_parede = pr[4];
    var cor_telhado = pr[5];

    // Converte pra pixels
    var px_px = px_tile * TILE;
    var py_px = py_tile * TILE;
    var pw_px = pw_tile * TILE;
    var ph_px = ph_tile * TILE;

    // Telhado (30% em cima)
    var telhado = this.add.rectangle(
      px_px + pw_px / 2,
      py_px + ph_px * 0.15,
      pw_px,
      ph_px * 0.3,
      cor_telhado
    );
    telhado.setDepth(py_px + ph_px * 0.15);

    // Parede (70% embaixo)
    var parede = this.add.rectangle(
      px_px + pw_px / 2,
      py_px + ph_px * 0.65,
      pw_px,
      ph_px * 0.7,
      cor_parede
    );
    parede.setDepth(py_px + ph_px * 0.65);
  }

  console.log('[REINO] ' + PREDIOS.length + ' predios criados');

  // ===== CASAS DO REINO (20 casas pequenas) =====
  // Formato: [x_tile, y_tile, w_tile, h_tile, cor_parede, cor_telhado]
  var CASAS = [
    // NO - entre prefeitura e cruz
    [24, 14, 3, 3, 0xd09080, 0x905040],
    [24, 19, 3, 3, 0x80b0d0, 0x407090],
    [24, 24, 3, 3, 0xc0a070, 0x806030],

    // NE - entre ferreiro e cruz
    [36, 14, 3, 3, 0xd09080, 0x905040],
    [36, 19, 3, 3, 0xa0d080, 0x608040],
    [36, 24, 3, 3, 0xc0a070, 0x806030],

    // SO - entre pvp e cruz
    [24, 37, 3, 3, 0x80b0d0, 0x407090],
    [24, 42, 3, 3, 0xd09080, 0x905040],
    [24, 47, 3, 3, 0xc0a070, 0x806030],

    // SE - entre mercador e cruz
    [36, 37, 3, 3, 0xa0d080, 0x608040],
    [36, 42, 3, 3, 0x80b0d0, 0x407090],
    [36, 47, 3, 3, 0xd09080, 0x905040],

    // Topo (faixa entre cruz e muro N)
    [18, 11, 3, 2, 0xd09080, 0x905040],
    [28, 11, 3, 2, 0x80b0d0, 0x407090],
    [34, 11, 3, 2, 0xa0d080, 0x608040],

    // Fundo (faixa entre cruz e muro S)
    [18, 51, 3, 2, 0xc0a070, 0x806030],
    [28, 51, 3, 2, 0xd09080, 0x905040],
    [34, 51, 3, 2, 0x80b0d0, 0x407090],

    // Lateral (perto dos muros laterais)
    [48, 30, 3, 2, 0xa0d080, 0x608040],
    [13, 30, 3, 2, 0xd09080, 0x905040],
  ];

  for (var ci = 0; ci < CASAS.length; ci++) {
    var cs = CASAS[ci];
    var cx_tile = cs[0];
    var cy_tile = cs[1];
    var cw_tile = cs[2];
    var ch_tile = cs[3];
    var c_cor_parede = cs[4];
    var c_cor_telhado = cs[5];

    var cx_px = cx_tile * TILE;
    var cy_px = cy_tile * TILE;
    var cw_px = cw_tile * TILE;
    var ch_px = ch_tile * TILE;

    // Telhado (40% em cima - casas tem telhado maior que predios)
    var c_telhado = this.add.rectangle(
      cx_px + cw_px / 2,
      cy_px + ch_px * 0.2,
      cw_px,
      ch_px * 0.4,
      c_cor_telhado
    );
    c_telhado.setDepth(cy_px + ch_px * 0.2);

    // Parede (60% embaixo)
    var c_parede = this.add.rectangle(
      cx_px + cw_px / 2,
      cy_px + ch_px * 0.7,
      cw_px,
      ch_px * 0.6,
      c_cor_parede
    );
    c_parede.setDepth(cy_px + ch_px * 0.7);
  }

  console.log('[REINO] ' + CASAS.length + ' casas criadas');

  // Cria as animacoes
  var DIRS = ['baixo','cima','esq','dir'];
  for (var di = 0; di < DIRS.length; di++) {
    var d = DIRS[di];
    // Andar (9 frames)
    var framesW = [];
    for (var i = 0; i < 9; i++) framesW.push({ key: 'walk-' + d + '-' + i });
    this.anims.create({ key: 'andar-' + d, frames: framesW, frameRate: 14, repeat: -1 });
    // Parado (2 frames lentos)
    this.anims.create({
      key: 'parado-' + d,
      frames: [{ key: 'idle-' + d + '-0' }, { key: 'idle-' + d + '-1' }],
      frameRate: 2,
      repeat: -1
    });
    // Ataque (6 frames, roda uma vez)
    var framesA = [];
    for (var j = 0; j < 6; j++) framesA.push({ key: 'slash-' + d + '-' + j });
    this.anims.create({ key: 'atacar-' + d, frames: framesA, frameRate: 18, repeat: 0 });
  }

  // Player
  player = this.physics.add.sprite(cx, cy, 'idle-baixo-0');
  player.setDepth(10);
  player.setScale(1.55);
  player.setCollideWorldBounds(true);

  this.physics.world.setBounds(0, 0, LW, LH);
  this.cameras.main.setBounds(0, 0, LW, LH);
  this.cameras.main.startFollow(player, true, 0.08, 0.08);
  this.cameras.main.setZoom(0.3);

  // ===== DISTRIBUICAO DE ARVORES =====
var ARVORES_CARREGAR = {
    brown:  ['brown_01','brown_02','brown_03','brown_04','brown_05','brown_06','brown_07','brown_08','brown_09','brown_10','brown_11','brown_12','brown_13','brown_14','brown_15','brown_16','brown_17','brown_18','brown_19','brown_20','brown_21','brown_22','brown_23','brown_24','brown_25','brown_26','brown_27','brown_28','brown_29','brown_30','brown_31','brown_32','brown_33','brown_34','brown_35','brown_36','brown_37','brown_38','brown_39'],
    dead:   ['dead_01','dead_02','dead_03','dead_04','dead_05','dead_06','dead_07','dead_08','dead_09','dead_10','dead_11','dead_12','dead_13','dead_14','dead_15','dead_16','dead_17','dead_18','dead_19','dead_20','dead_21','dead_22','dead_23','dead_24','dead_25','dead_26','dead_27','dead_28','dead_29','dead_30','dead_31','dead_32','dead_33','dead_34','dead_35','dead_36','dead_37'],
    green:  ['green_01','green_02','green_03','green_04','green_05','green_06','green_07','green_08','green_09','green_10','green_11','green_12','green_13','green_14','green_15','green_16','green_17','green_18','green_19','green_20','green_21','green_22','green_23','green_24','green_25','green_26','green_27','green_28','green_29','green_30','green_31','green_32','green_33','green_34','green_35','green_36','green_37','green_38','green_39'],
    orange: ['orange_01','orange_02','orange_03','orange_04','orange_05','orange_06','orange_07','orange_08','orange_09','orange_10','orange_11','orange_12','orange_13','orange_14','orange_15','orange_16','orange_17','orange_18','orange_19','orange_20','orange_21','orange_22','orange_23','orange_24','orange_25','orange_26','orange_27','orange_28','orange_29','orange_30','orange_31','orange_32','orange_33','orange_34','orange_35','orange_36','orange_37','orange_38','orange_39']
  };

  // Seed fixa
  var seed = 12345;
  function rand() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  function biomaEm(x, y) {
    var mx = LW / 2, my = LH / 2;
    if (x < mx && y < my) return 'brown';
    if (x >= mx && y < my) return 'green';
    if (x < mx && y >= my) return 'dead';
    return 'orange';
  }

  var PASSO = 256;
  var MARGEM_BORDA = 300;         // nao coloca arvore perto da borda do mundo
  var DIST_MIN = 130;              // distancia minima entre 2 arvores (px)
  var contadorArv = 0;
  var posicoesColocadas = [];     // lista de {x, y} das arvores ja colocadas

  function muitoPerto(nx, ny) {
    for (var k = 0; k < posicoesColocadas.length; k++) {
      var dx = nx - posicoesColocadas[k].x;
      var dy = ny - posicoesColocadas[k].y;
      if (Math.sqrt(dx*dx + dy*dy) < DIST_MIN) return true;
    }
    return false;
  }

  for (var ty = 0; ty < LH; ty += PASSO) {
    for (var tx = 0; tx < LW; tx += PASSO) {
      var px = tx + rand() * PASSO;
      var py = ty + rand() * PASSO;

      // Margem das bordas
      if (px < MARGEM_BORDA || px > LW - MARGEM_BORDA) continue;
      if (py < MARGEM_BORDA || py > LH - MARGEM_BORDA) continue;

      // Vazio (40%)
      if (true) continue;  // ARVORES DESATIVADAS TEMPORARIAMENTE

      // Distancia minima entre arvores
      if (muitoPerto(px, py)) continue;

      // Nao coloca arvore em cima do caminho (cruz central)
      // O caminho eh uma cruz de 128px de largura (2 tiles)
      var cx3 = LW / 2, cy3 = LH / 2;
      var TAM_CAMINHO = 128;
      var no_caminho_h = (py > cy3 - TAM_CAMINHO && py < cy3 + TAM_CAMINHO);
      var no_caminho_v = (px > cx3 - TAM_CAMINHO && px < cx3 + TAM_CAMINHO);
      if (no_caminho_h || no_caminho_v) continue;

      var bioma = biomaEm(px, py);
      var lista = ARVORES_CARREGAR[bioma];
      var arq = lista[Math.floor(rand() * lista.length)];
      var key = 'tree-' + arq;
      var arv = this.add.image(px, py, key);
      arv.setOrigin(0.5, 1);
      arv.setScale(1);
      arv.setDepth(py);
      posicoesColocadas.push({ x: px, y: py });
      contadorArv++;
    }
  }
  console.log('[DECOR] ' + contadorArv + ' arvores colocadas (min dist ' + DIST_MIN + 'px)');

    // Teclado
  teclas = this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');

  // JOYSTICK
  var joy = document.getElementById('joy');
  var knob = document.getElementById('joy-knob');
  var R = 50;

  joy.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var r = joy.getBoundingClientRect();
    joyOrigem.x = r.left + r.width / 2;
    joyOrigem.y = r.top + r.height / 2;
    joyAtivo = true;
    atualizarKnob(e.touches[0]);
  }, { passive: false });

  joy.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (!joyAtivo) return;
    atualizarKnob(e.touches[0]);
  }, { passive: false });

  joy.addEventListener('touchend', function(e) {
    e.preventDefault();
    joyAtivo = false;
    joyDelta.x = 0; joyDelta.y = 0;
    knob.style.transform = 'translate(0,0)';
  }, { passive: false });

  function atualizarKnob(t) {
    var dx = t.clientX - joyOrigem.x;
    var dy = t.clientY - joyOrigem.y;
    var d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    joyDelta.x = dx / R;
    joyDelta.y = dy / R;
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }

  // Botoes
  document.getElementById('btn-atk').addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (atacando) return;
    atacando = true;
    player.anims.play('atacar-' + ultimaDir, true);
    player.once('animationcomplete', function() {
      atacando = false;
      player.anims.play('parado-' + ultimaDir, true);
    });
  }, { passive: false });

  document.getElementById('btn-info').addEventListener('touchstart', function(e) {
    e.preventDefault();
    alert('Pos: ' + Math.round(player.x) + ', ' + Math.round(player.y));
  }, { passive: false });
}

function update() {
  var VEL = 100;
  var vx = 0, vy = 0;

  if (teclas.LEFT.isDown || teclas.A.isDown) vx -= 1;
  if (teclas.RIGHT.isDown || teclas.D.isDown) vx += 1;
  if (teclas.UP.isDown || teclas.W.isDown) vy -= 1;
  if (teclas.DOWN.isDown || teclas.S.isDown) vy += 1;

  if (joyAtivo && (Math.abs(joyDelta.x) > 0.15 || Math.abs(joyDelta.y) > 0.15)) {
    vx = joyDelta.x;
    vy = joyDelta.y;
  }

  var mag = Math.hypot(vx, vy);
  if (mag > 1) { vx /= mag; vy /= mag; }

  player.setVelocity(vx * VEL, vy * VEL);

  // Se esta atacando E andando, cancela ataque visual e toca andar
  var andando = Math.abs(vx) > 0.05 || Math.abs(vy) > 0.05;
  if (atacando && andando) {
    atacando = false;
    player.off('animationcomplete');
  }
  if (atacando) return;

  // Detecta direcao
  if (andando) {
    var dir;
    if (Math.abs(vx) > Math.abs(vy)) dir = vx > 0 ? 'dir' : 'esq';
    else dir = vy > 0 ? 'baixo' : 'cima';
    ultimaDir = dir;
    player.anims.play('andar-' + dir, true);
  } else {
    // Parado: toca animacao idle
    if (player.anims.currentAnim === null || player.anims.currentAnim.key !== 'parado-' + ultimaDir) {
      player.anims.play('parado-' + ultimaDir, true);
    }
  }
}

// Inicia igual ao teste que funcionou
var game;
try {
  game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'jogo',
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: '#2a4a2a',
    pixelArt: true,
    roundPixels: true,
    antialias: false,
    physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
    scene: { preload: preload, create: create, update: update }
  });
} catch(e) {
  alert('ERRO: ' + e.message);
}

// Resize responsivo (landscape <-> portrait)
window.addEventListener('resize', function() {
  if (!game) return;
  var w = window.innerWidth;
  var h = window.innerHeight;
  game.scale.resize(w, h);
  if (game.scene && game.scene.scenes[0]) {
    var sc = game.scene.scenes[0];
    if (sc.cameras && sc.cameras.main) {
      sc.cameras.main.setSize(w, h);
    }
  }
});

// Forca resize uma vez apos carregar (alguns WebView nao disparam)
setTimeout(function(){
  window.dispatchEvent(new Event('resize'));
}, 500);
</script>
